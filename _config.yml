title: Riccardo Serraino
description: Automation and Control Engineering | Politecnico di Milano

baseurl: "" #empty because the repository is named riccardoserraino.github.io
url: "https://riccardoserraino.github.io" #custom url to be used instead of GitHub repository
email: ricc.serraino@gmail.com
email_academic: riccardo.serraino@mail.polimi.it

# Social media links in footer
linkedin: "riccardo-serraino"
#stackoverflow: ""
github: "riccardoserraino"
#researchgate: ""
#orcid: ""
#quora: ""
instagram: "riccardo.serraino"
#facebook: ""
#bluesky: ""
#substack: ""

# Markdown
highlighter: rouge
markdown: kramdown

# Tracker
analytics:

# Visit counter (GoatCounter, free, no cookies). Put your GoatCounter code here,
# e.g. "riccardoserraino" if your dashboard is riccardoserraino.goatcounter.com.
# Leave empty to switch the counter off completely. See GUIDE.md, section 8.
goatcounter: "riccardoserraino"
# Show "N visits in the past month" at the bottom of the home page (true/false).
show_visits: true

# optimization -> compress.html
compress_html:
  clippings: [html,div, p, ul, td, h1, h2, h3, h4,link, meta, footer, nav, img, header, hr, br, head, style, li, ul, ol, time, main, script, title]
  comments: ["<!-- ", " -->"]
  endings: [all]
  ignore:
    envs: [local]
  blanklines: false
  profile: false
  startings: []

#collection
collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

sass:
  sass_dir: /assets/css/_sass
  style: compressed

include:
  - _pages

exclude:
  - README.md
  - LICENSE.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - GUIDE.md

plugins:
  - jekyll-seo-tag
  - jekyll-email-protect
  - jekyll-target-blank