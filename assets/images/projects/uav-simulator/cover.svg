<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="JetBrains Mono, ui-monospace, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="750" fill="#f7f9fc"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b4759"/></marker>
  </defs>
  <!-- quadrotor X -->
  <g transform="translate(330 380)">
    <g stroke="#0e1726" stroke-width="12" stroke-linecap="round"><path d="M-150 -150 L150 150 M150 -150 L-150 150"/></g>
    <rect x="-46" y="-46" width="92" height="92" rx="16" fill="#0e1726"/>
    <g fill="#2f6fe0" fill-opacity="0.16" stroke="#2f6fe0" stroke-width="4">
      <circle cx="-150" cy="-150" r="78"/><circle cx="150" cy="-150" r="78"/><circle cx="150" cy="150" r="78"/><circle cx="-150" cy="150" r="78"/>
    </g>
    <g fill="none" stroke="#3b4759" stroke-width="3" marker-end="url(#a)">
      <path d="M-200 -150 A50 50 0 0 1 -150 -200"/><path d="M200 -150 A50 50 0 0 0 150 -200"/>
      <path d="M200 150 A50 50 0 0 1 150 200"/><path d="M-200 150 A50 50 0 0 0 -150 200"/>
    </g>
    <path d="M0 0 H110" stroke="#d93a46" stroke-width="6" marker-end="url(#a)"/><text x="112" y="-12" font-size="24" fill="#d93a46">x_B</text>
    <text x="0" y="300" font-size="28" fill="#0e1726" text-anchor="middle">Quadrotor · 4 rotors</text>
    <text x="0" y="336" font-size="20" fill="#6b7789" text-anchor="middle">under-actuated</text>
  </g>
  <!-- hexacopter -->
  <g transform="translate(880 380)">
    <g stroke="#0e1726" stroke-width="12" stroke-linecap="round"><path d="M0 0 L200 0 M0 0 L100 173 M0 0 L-100 173 M0 0 L-200 0 M0 0 L-100 -173 M0 0 L100 -173"/></g>
    <circle r="50" fill="#0e1726"/>
    <g fill="#0d9488" fill-opacity="0.16" stroke="#0d9488" stroke-width="4">
      <ellipse cx="200" cy="0" rx="64" ry="34" transform="rotate(30 200 0)"/>
      <ellipse cx="100" cy="173" rx="64" ry="34" transform="rotate(-30 100 173)"/>
      <ellipse cx="-100" cy="173" rx="64" ry="34" transform="rotate(30 -100 173)"/>
      <ellipse cx="-200" cy="0" rx="64" ry="34" transform="rotate(-30 -200 0)"/>
      <ellipse cx="-100" cy="-173" rx="64" ry="34" transform="rotate(30 -100 -173)"/>
      <ellipse cx="100" cy="-173" rx="64" ry="34" transform="rotate(-30 100 -173)"/>
    </g>
    <text x="0" y="300" font-size="28" fill="#0e1726" text-anchor="middle">Hexacopter · 6 rotors</text>
    <text x="0" y="336" font-size="20" fill="#6b7789" text-anchor="middle">fully actuated (6-DOF wrench)</text>
  </g>
  <text x="600" y="70" font-size="26" fill="#0e1726" text-anchor="middle">state x = [p, q, v, ω]  ·  input u = rotor thrusts  ·  RK4</text>
</svg>
