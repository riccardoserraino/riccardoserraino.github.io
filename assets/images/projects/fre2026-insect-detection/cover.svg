<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="JetBrains Mono, ui-monospace, monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#14304a"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f4d2b"/>
      <stop offset="1" stop-color="#0f2a17"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.78" cy="0.12" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect width="1200" height="750" fill="url(#sun)"/>
  <!-- field with crop rows in perspective -->
  <path d="M0 330 L1200 330 L1200 750 L0 750Z" fill="url(#field)"/>
  <g stroke="#3f8f52" stroke-opacity="0.55" stroke-width="3" fill="none">
    <path d="M600 330 L-500 750"/><path d="M600 330 L-150 750"/><path d="M600 330 L200 750"/>
    <path d="M600 330 L600 750"/><path d="M600 330 L1000 750"/><path d="M600 330 L1350 750"/><path d="M600 330 L1700 750"/>
  </g>
  <g stroke="#2d6b3c" stroke-opacity="0.5" stroke-width="2">
    <path d="M0 380 H1200"/><path d="M0 450 H1200"/><path d="M0 550 H1200"/><path d="M0 690 H1200"/>
  </g>

  <!-- ladybug -->
  <g transform="translate(250 520)">
    <ellipse cx="0" cy="0" rx="62" ry="54" fill="#e5383b"/>
    <path d="M0 -54 V54" stroke="#111" stroke-width="5"/>
    <ellipse cx="0" cy="-58" rx="30" ry="18" fill="#111"/>
    <circle cx="-30" cy="-12" r="11" fill="#111"/><circle cx="30" cy="-12" r="11" fill="#111"/>
    <circle cx="-26" cy="24" r="9" fill="#111"/><circle cx="26" cy="24" r="9" fill="#111"/>
  </g>
  <!-- bee -->
  <g transform="translate(610 470) rotate(-12)">
    <ellipse cx="-8" cy="-42" rx="30" ry="20" fill="#e0f2fe" fill-opacity="0.75"/>
    <ellipse cx="22" cy="-40" rx="26" ry="17" fill="#e0f2fe" fill-opacity="0.6"/>
    <ellipse cx="0" cy="0" rx="62" ry="36" fill="#fbbf24"/>
    <path d="M-28 -33 V33 M0 -36 V36 M28 -31 V31" stroke="#111" stroke-width="12"/>
    <circle cx="-64" cy="-2" r="22" fill="#111"/>
  </g>
  <!-- butterfly -->
  <g transform="translate(940 520)">
    <path d="M0 0 C-40 -90 -120 -80 -100 -10 C-90 20 -40 20 0 0Z" fill="#a78bfa"/>
    <path d="M0 0 C40 -90 120 -80 100 -10 C90 20 40 20 0 0Z" fill="#a78bfa"/>
    <path d="M0 4 C-30 60 -90 70 -78 26 C-70 6 -30 6 0 4Z" fill="#7c3aed"/>
    <path d="M0 4 C30 60 90 70 78 26 C70 6 30 6 0 4Z" fill="#7c3aed"/>
    <circle cx="-62" cy="-30" r="12" fill="#fde68a"/><circle cx="62" cy="-30" r="12" fill="#fde68a"/>
    <rect x="-5" y="-50" width="10" height="100" rx="5" fill="#111"/>
  </g>

  <!-- detection boxes -->
  <g fill="none" stroke-width="4">
    <rect x="168" y="440" width="164" height="160" rx="6" stroke="#f87171"/>
    <rect x="528" y="400" width="172" height="130" rx="6" stroke="#fbbf24"/>
    <rect x="828" y="430" width="224" height="170" rx="6" stroke="#c4b5fd"/>
  </g>
  <g font-size="22" font-weight="700">
    <rect x="166" y="406" width="118" height="34" rx="4" fill="#f87171"/>
    <text x="180" y="430" fill="#1a0a0a">LADYBUG</text>
    <rect x="526" y="366" width="66" height="34" rx="4" fill="#fbbf24"/>
    <text x="540" y="390" fill="#1a1405">BEE</text>
    <rect x="826" y="396" width="146" height="34" rx="4" fill="#c4b5fd"/>
    <text x="840" y="420" fill="#140b26">BUTTERFLY</text>
  </g>

  <rect width="1200" height="750" fill="url(#scan)"/>
  <!-- viewfinder HUD -->
  <g stroke="#5eead4" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M40 110 V40 H110"/><path d="M1090 40 H1160 V110"/>
    <path d="M40 640 V710 H110"/><path d="M1160 640 V710 H1090"/>
  </g>
  <g font-size="24" fill="#cffafe">
    <circle cx="78" cy="88" r="9" fill="#ef4444"/>
    <text x="98" y="96">LIVE · OAK-D PRO · YOLO11 on-device</text>
    <text x="1122" y="96" text-anchor="end" fill="#5eead4">ROS 2</text>
    <text x="80" y="680" fill="#99f6e4" font-size="20">/oak/detections  →  LED signal</text>
  </g>
</svg>
